name: Refresh NixOS cache

run-name: Nix cache · ${{ github.event_name }} · ${{ github.ref_name }}

on:
  push:
    branches: [master]
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
    inputs:
      retry_failed:
        description: Retry unchanged derivations that failed before
        type: boolean
        default: false
  workflow_call:
    inputs:
      retry_failed:
        type: boolean
        default: false
    secrets:
      NIX_CACHE_SIGNING_KEY:
        required: true
      NIX_CACHE_READ_TOKEN:
        required: true
      NIX_CACHE_WRITE_TOKEN:
        required: true

permissions:
  contents: read

concurrency:
  group: nixos-cache
  cancel-in-progress: false

jobs:
  build:
    name: Build and publish cache
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Configure private cache access
        env:
          NIX_CACHE_READ_TOKEN: ${{ secrets.NIX_CACHE_READ_TOKEN }}
        run: |
          : "${NIX_CACHE_READ_TOKEN:?Missing NIX_CACHE_READ_TOKEN secret}"
          umask 077
          printf 'machine abdulrahman1s-nix-cache.citizen6775.workers.dev\nlogin nix\npassword %s\n' \
            "$NIX_CACHE_READ_TOKEN" > "$HOME/.netrc"
      # Build inputs can still be large, especially the kernel toolchain.
      - uses: jlumbroso/free-disk-space@v2.0.0
        with:
          swap-storage: false
          preinstalled-runtimes: false
      - name: Prepare post-build hook
        run: install -m 0555 .github/scripts/nix-cache.py /tmp/record-nix-build
      - uses: cachix/install-nix-action@v31
        with:
          install_options: --no-daemon
          extra_nix_config: |
            accept-flake-config = true
            max-jobs = 2
            cores = 2
            post-build-hook = /tmp/record-nix-build
            netrc-file = /home/runner/.netrc
      - name: Build and publish cache
        env:
          RETRY_FAILED: ${{ inputs.retry_failed }}
          NIX_CACHE_SIGNING_KEY: ${{ secrets.NIX_CACHE_SIGNING_KEY }}
          NIX_CACHE_WRITE_TOKEN: ${{ secrets.NIX_CACHE_WRITE_TOKEN }}
          NIX_CACHE_URL: https://abdulrahman1s-nix-cache.citizen6775.workers.dev
        run: python3 .github/scripts/nix-cache.py
