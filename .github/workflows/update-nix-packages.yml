name: Update maintained packages

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true
      - name: Update upstream binaries
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash nix-packages/update.sh
      - name: Update all flake inputs
        run: nix flake update
      - name: Evaluate NixOS system
        run: nix eval --raw .#nixosConfigurations.default.config.system.build.toplevel.drvPath --no-update-lock-file
      - name: Commit evaluated updates
        run: |
          git add -- nix-packages/versions.json flake.lock
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update maintained Nix packages'
          git push
  cache:
    needs: update
    uses: ./.github/workflows/build-cache.yml
    secrets:
      NIX_CACHE_SIGNING_KEY: ${{ secrets.NIX_CACHE_SIGNING_KEY }}
      NIX_CACHE_READ_TOKEN: ${{ secrets.NIX_CACHE_READ_TOKEN }}
      NIX_CACHE_WRITE_TOKEN: ${{ secrets.NIX_CACHE_WRITE_TOKEN }}
