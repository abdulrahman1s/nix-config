# Config Generated by MangoJuice #
legacy_layout=false
# WireView custom_text and exec rows use MangoHud's secondary font.
font_size=22
font_size_secondary=22
table_columns=3
width=460
round_corners=12
cellpadding_y=0
# Keep MangoHud out of the DLSS IV helper; its config watcher crashed there.
blacklist=pamac-manager,lact,ghb,bitwig-studio,ptyxis,yumex,dlssiv-helper.exe,photocraft
custom_text_center=Performance
gpu_stats
gpu_load_change
gpu_temp
gpu_fan
gpu_power
# NVIDIA's process query lets system and game VRAM share one row.
custom_text=VRAM
exec=$HOME/system-conf/config/MangoHud/gpu.sh system_vram
exec=$HOME/system-conf/config/MangoHud/gpu.sh game_vram
cpu_stats
cpu_load_change
cpu_mhz
cpu_temp
cpu_power
custom_text=CPU Fan
exec=[ "${mangohud_fast_loaded:-}" = 1 ] || . "$HOME/system-conf/config/MangoHud/fast-readings.sh"; hud_cpu_fan
custom_text=
ram
swap
fps
fps_color_change
fps_metrics=avg,0.01,0.001
frame_timing

# Pair readings across the three columns so the WireView section stays compact.
custom_text_center=WireView Pro II
custom_text=Current
exec=[ "${mangohud_fast_loaded:-}" = 1 ] || . "$HOME/system-conf/config/MangoHud/fast-readings.sh"; hud_wireview_current
exec=[ "${mangohud_fast_loaded:-}" = 1 ] || . "$HOME/system-conf/config/MangoHud/fast-readings.sh"; hud_wireview_imbalance
# Pins 1–3 appear in the middle cell and pins 4–6 in the right cell (amps).
custom_text=Pins
exec=$HOME/system-conf/config/MangoHud/wireview.sh pins_1_3
exec=$HOME/system-conf/config/MangoHud/wireview.sh pins_4_6
custom_text=In/Out
exec=$HOME/system-conf/config/MangoHud/wireview.sh temps
exec=$HOME/system-conf/config/MangoHud/wireview.sh external
custom_text=Status
exec=$HOME/system-conf/config/MangoHud/wireview.sh fan
exec=$HOME/system-conf/config/MangoHud/wireview.sh faults
custom_text=Power
exec=$HOME/system-conf/config/MangoHud/wireview.sh power
custom_text=
gamemode
wine
no_display
toggle_logging=Shift_L+F2
toggle_hud_position=Shift_R+F11
output_folder=/home/abdulrahman
fps_limit_method=late
toggle_fps_limit=Shift_L+F1
background_alpha=0.64
position=top-left
toggle_hud=Shift_R+F12
gpu_text=GPU
gpu_color=61d7a6
cpu_text=CPU
cpu_color=72cced
fps_value=30,60
fps_color=e96e76,f3cb70,77dba5
gpu_load_value=50,90
gpu_load_color=dae5e8,f1c46d,ed6976
cpu_load_value=50,90
cpu_load_color=dae5e8,f1c46d,ed6976
background_color=000000
frametime_color=72c8e8
vram_color=ad82d4
ram_color=d793bb
wine_color=bfcad9
engine_color=e6b574
text_color=e8edf2
media_player_color=ffffff
network_color=e07b85
battery_color=00ff00
media_player_format={title};{artist};{album}
