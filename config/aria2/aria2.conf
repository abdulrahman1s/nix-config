# ── Connection / parallelism ──────────────────────────────────────────────────

# Open up to 16 TCP connections to a single host. Default 1.
# Bypasses per-connection bandwidth throttling many CDNs apply. 16 is the cap.
max-connection-per-server=16

# Split the file into 16 byte-ranges, one per connection. Default 5.
split=16

# Minimum size for a split. Default is 20M, which means `split=16` silently
# does nothing on files <320M (only ⌊size/20M⌋ splits are created). 1M lets
# the splits actually engage on anything ≥16MB.
min-split-size=1M

# Resume a partial download from its .aria2 control file instead of restarting.
continue=true


# ── Disk I/O ──────────────────────────────────────────────────────────────────

# How to reserve disk space before writing:
#   prealloc (default) — writes zeros to the whole file, slow on multi-GB
#   falloc             — fallocate() syscall, INSTANT on ext4/xfs/btrfs/ntfs,
#                        also prevents fragmentation
#   none               — skip allocation, fastest start but fragmented
#   trunc              — ftruncate(), creates a sparse file
file-allocation=falloc

# Use mmap() to write the output file instead of write() syscalls.
# Reduces kernel/userspace copies on large files. Needs file-allocation≠none.
enable-mmap=true

# In-memory write buffer. Holds up to 64MB of received pieces and flushes them
# as larger sequential writes instead of many small ones. Big win on HDDs.
disk-cache=64M


# ── HTTP behavior ─────────────────────────────────────────────────────────────

# Send `Accept-Encoding: gzip, deflate`. Helps for text/JSON/HTML if the server
# compresses on the fly. No effect on already-compressed payloads (zip, mp4…).
http-accept-gzip=true

# When -j > 1 (multiple files in flight), aria2 measures throughput and tunes
# concurrency dynamically. No effect on single-URL downloads.
optimize-concurrent-downloads=true

# Resolve hostnames via aria2's built-in async resolver instead of blocking
# getaddrinfo(). Avoids stalls on slow DNS. (Default true; explicit.)
async-dns=true

# If a URI fails after retry, aria2 may try it again later rather than dropping
# it from the pool. (Default true; explicit.)
reuse-uri=true

# Override the default `aria2/1.37.0` UA. Some CDNs (Cloudflare, GitHub
# releases, certain mirrors) throttle or 403 non-browser user-agents.
user-agent=Mozilla/5.0


# ── Timeouts / retries ────────────────────────────────────────────────────────

# Give up on TCP handshake after 15s. Default 60s wastes a full minute on
# dead mirrors before failover.
connect-timeout=15

# Idle-data timeout. Drop and retry a connection that sends no bytes for 60s.
timeout=60

# Retry a failed download up to 5 times before giving up. (Default 5; explicit.)
max-tries=5

# Wait 2 seconds between retries. Default is 0, which can hammer a struggling
# server and get you rate-limited.
retry-wait=2


# ── File handling ─────────────────────────────────────────────────────────────

# Don't silently save as file.1, file.2 when the target exists. With this off,
# behavior depends on allow-overwrite below.
auto-file-renaming=false

# Combined with the above: re-running the command overwrites the existing file
# in place. Same command → same file path, every time.
allow-overwrite=true


# ── Output ────────────────────────────────────────────────────────────────────

# Suppress chatty `notice`-level lines (the default). The progress bar still
# renders; you only see warnings and errors.
console-log-level=warn

# Refresh the progress summary every 1 second (default 60). Makes the live
# download stats actually feel live.
summary-interval=1
